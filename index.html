<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新生住宿协同系统</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;color:#1D2129;background:var(--fill,#F2F3F5);font-family:-apple-system,"PingFang SC","Microsoft YaHei UI","Segoe UI",sans-serif;line-height:1.55}:root{--primary:#165DFF;--primary-hover:#4080FF;--primary-bg:#E8F3FF;--ink:#1D2129;--text2:#4E5969;--text3:#86909C;--border:#E5E6EB;--fill:#F2F3F5;--fill2:#F7F8FA}.shell{width:min(880px,100%);overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 8px 32px rgba(29,33,41,.08)}header{display:flex;justify-content:space-between;gap:20px;padding:30px 36px;color:#fff;background:linear-gradient(135deg,#0E42D2,#4080FF)}.brand{display:flex;align-items:center;gap:12px}.brand i{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.16);font-size:19px;font-style:normal;font-weight:600}.brand b,.brand small{display:block}.brand b{font-size:15px;font-weight:600}.brand small{margin-top:4px;color:#CFE3FF;font-size:10px;letter-spacing:.12em}header>span{align-self:center;padding:6px 10px;border-radius:999px;color:#fff;background:rgba(255,255,255,.14);font-size:11px;font-weight:500}main{padding:34px}.kicker{color:var(--primary);font-size:11px;font-weight:600;letter-spacing:.16em}h1{margin:10px 0 8px;font-size:24px;font-weight:600}main>p{margin:0;color:var(--text2);font-size:14px;line-height:1.6}.entries{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}.entry{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:220px;padding:22px;border:1px solid var(--border);border-radius:16px;color:inherit;text-decoration:none;background:#fff;transition:.2s}.entry:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 24px rgba(22,93,255,.12)}.entry i{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;color:#fff;background:var(--primary);font-size:16px;font-style:normal;font-weight:600}.entry.admin i{background:#722ED1}.entry h2{margin:18px 0 7px;font-size:16px;font-weight:600}.entry p{margin:0;color:var(--text3);font-size:13px;line-height:1.6}.entry b{margin-top:auto;color:var(--primary);font-size:13px;font-weight:500}.entry.admin b{color:#722ED1}.tip{display:flex;gap:10px;margin-top:20px;padding:13px 15px;border-radius:12px;color:var(--text2);background:var(--fill2);font-size:13px;line-height:1.6}.tip strong{color:var(--primary);white-space:nowrap;font-weight:600}@media(max-width:620px){body{padding:0}.shell{min-height:100vh;border-radius:0}header,main{padding:22px 18px}.entries{grid-template-columns:1fr}.entry{min-height:0}header>span{display:none}h1{font-size:21px}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand"><i>寝</i><div><b>新生住宿协同系统</b><small>ONE SYSTEM · TWO ENTRANCES</small></div></div><span>宿舍协同工具</span></header>
    <main>
      <span class="kicker">请选择入口</span><h1>学生和辅导员，共用同一套住宿数据</h1><p>学生填写问卷并确认组队；辅导员通过独立账号查看进度、审核小组和发布分寝结果。</p>
      <div class="entries">
        <a class="entry" href="student/"><i>学</i><h2>学生入口</h2><p>核验班级、姓名和学号，填写生活习惯问卷，邀请并确认四人意向组。</p><b>进入学生端 →</b></a>
        <a class="entry admin" href="admin/"><i>辅</i><h2>辅导员入口</h2><p>账号密码登录，查看各班问卷进度、审核组队、生成并发布分寝结果。</p><b>进入工作台 →</b></a>
      </div>
      <div class="tip"><strong>隐私提示</strong><span>正式导入名单后，学生只能查看自己的提交状态和必要的组队信息，不能读取其他同学的完整问卷。</span></div>
    </main>
  </div>
</body>
</html>
